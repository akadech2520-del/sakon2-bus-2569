<style>
  .fatal-error{position:fixed;inset:0;z-index:9999;background:rgba(15,45,70,.72);display:grid;place-items:center;padding:20px}
  .fatal-error .card{width:min(560px,100%);box-shadow:0 24px 70px rgba(0,0,0,.28)}
  @import url("https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap");

  :root {

  .loading { opacity: .7; pointer-events: none; }

  }
</style>
